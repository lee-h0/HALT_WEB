spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HALT_WEB_DB;encrypt=true;trustServerCertificate=true
spring.datasource.username=halt_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.access-token-minutes=30

spring.jpa.open-in-view=false

app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=gemini-3.5-flash-lite